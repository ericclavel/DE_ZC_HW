version: 2

sources:
- name: staging
  database: arctic-operand-398220
  schema: zoomcamp

  tables:
  - name: green_tripdata
  - name: yellow_tripdata
  - name: fhv_tripdata

models:
  - name: stg__green_tripdata
    columns:
      - name: trip_id
        data_tests:
          - unique:
              config:
                severity: warn
          - not_null

      - name: vendor_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 4, 6, 7]
                quote: false

      - name: pickup_datetime
        data_tests:
          - not_null

      - name: dropoff_datetime
        data_tests:
          - not_null

      - name: pickup_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id

      - name: dropoff_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id

      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]
                quote: false

      - name: rate_code_id
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 99]
                quote: false

  - name: stg__yellow_tripdata
    columns:
      - name: trip_id
        data_tests:
          - unique:
              config:
                severity: warn
          - not_null

      - name: vendor_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 4, 6, 7]
                quote: false

      - name: pickup_datetime
        data_tests:
          - not_null

      - name: dropoff_datetime
        data_tests:
          - not_null

      - name: pickup_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
          
      - name: dropoff_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id

      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]
                quote: false

      - name: rate_code_id
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 99]
                quote: false

  - name: stg__fhv_tripdata
    columns:
      - name: trip_id
        tests:
          - unique:
              config:
                severity: warn
          - not_null

      - name: dispatching_base_num
        tests:
          - not_null

      - name: pickup_datetime
        tests:
          - not_null

      - name: dropoff_datetime
        tests:
          - not_null

      - name: pickup_location_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
              config:
                severity: warn

      - name: dropoff_location_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
              config:
                severity: warn


